[project]
name = "breeze"
version = "1.0.0"
description = "A native Mac remote for Midea air conditioners, over your home Wi-Fi"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.10",
    "msmart-ng>=2026.9.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
